[package]
name = "eufy-decrypt"
version = "0.2.0"
edition = "2024"
authors = ["John Kelley <john@kelley.ca>"]
description = "Decrypt eufy camera SD-card recordings (.dat/.zxvideo) to MP4, fully offline and in pure Rust."
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/John-K/eufy-decrypt"
keywords = ["eufy", "decrypt", "video", "mp4", "camera"]
categories = ["command-line-utilities", "multimedia::video"]

[dependencies]
aes = "0.9.3"
anyhow = "1.0.104"
chrono = { version = "0.4.38", default-features = false, features = ["clock"] }
clap = { version = "4.6.7", features = ["derive"] }
hex = "0.4.3"
indicatif = "0.18.6"
md-5 = "0.11.0"
rayon = "1.12.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.0"
shiguredo_mp4 = "2026.5.0"
thiserror = "2.0.21"
walkdir = "2.5.0"
